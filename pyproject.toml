[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eligeschum-subsetcover"
version = "0.1.0"
description = "统计各子集的样本量与重叠，给出覆盖盲区"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eligeschum" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eligeschum.github.io"
Repository = "https://github.com/eligeschum/subsetcover"
Issues = "https://github.com/eligeschum/subsetcover/issues"

[project.scripts]
subsetcover = "subsetcover:main"

[tool.setuptools]
py-modules = ["subsetcover"]
